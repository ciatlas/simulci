# Case R6: reports which secrets arrived, never their values. The lab calls it with `secrets: inherit` from this
# repository (same owner as the caller) and from its mirror under another owner.
name: callee-r6-secrets
on: workflow_call
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "probe: lab-secret=${{ secrets.LAB_SECRET != '' }}"
          echo "probe: github-token=${{ secrets.GITHUB_TOKEN != '' }}"
          echo "probe: owner=${{ github.repository_owner }}"
