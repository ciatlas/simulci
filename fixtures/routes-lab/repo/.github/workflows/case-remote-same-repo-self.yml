# Case R10 (self form) - remote-same-repo-self: the same callee through `$/`, kept apart so a refusal sinks this run
# only.
name: case-remote-same-repo-self
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/callee-r10.yml']
jobs:
  self:
    uses: $/.github/workflows/callee-r10.yml
