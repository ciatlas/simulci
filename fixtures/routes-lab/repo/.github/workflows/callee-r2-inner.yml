# Helper for case R2: this repository's file at the path the remote calls through `./`; it must never run there.
name: callee-r2-inner
on:
  workflow_call:
    outputs:
      marker:
        description: which copy ran
        value: ${{ jobs.m.outputs.marker }}
jobs:
  m:
    runs-on: ubuntu-latest
    outputs:
      marker: ${{ steps.s.outputs.marker }}
    steps:
      - id: s
        name: probe
        run: |
          echo "marker=caller" >> "$GITHUB_OUTPUT"
          echo "probe: r2-inner=caller"
