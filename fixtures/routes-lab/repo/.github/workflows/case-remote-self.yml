# Case R2 (self form) - remote-self: a remote workflow that uses `$/` at job and step level, read at a SHA that is
# no longer the remote's `main` in the second round. Kept apart from R2 so a refusal of `$/` sinks this run only.
name: case-remote-self
on: workflow_dispatch
jobs:
  call:
    uses: ciatlas/simulci-lab-remote/.github/workflows/callee-r2-self.yml@d19def8c3562ef6c1be3f12443345575530f1ac4
  b:
    needs: call
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: 'echo "probe: needs.call.result=${{ needs.call.result }}"'
