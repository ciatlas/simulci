# Case R6 - remote-secrets-inherit: `secrets: inherit` into a remote of the same owner and into the same commit
# under another owner. The lab has a repository secret LAB_SECRET; the callee reports only whether it arrived.
name: case-remote-secrets-inherit
on: workflow_dispatch
jobs:
  same-owner:
    uses: ciatlas/simulci-lab-remote/.github/workflows/callee-r6-secrets.yml@d19def8c3562ef6c1be3f12443345575530f1ac4
    secrets: inherit
  other-owner:
    uses: rumankazi/simulci-lab-remote/.github/workflows/callee-r6-secrets.yml@d19def8c3562ef6c1be3f12443345575530f1ac4
    secrets: inherit
  b:
    needs: [same-owner, other-owner]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "probe: needs.same-owner.result=${{ needs.same-owner.result }}"
          echo "probe: needs.other-owner.result=${{ needs.other-owner.result }}"
