# Case R10 - remote-same-repo-ref: this repository's own callee by full ref `@main`, by `./` and by `$/`, run on the
# branch probe/r10, whose copy of callee-r10.yml says `branch` where main's says `main`.
name: case-remote-same-repo-ref
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/callee-r10.yml']
jobs:
  full-ref:
    uses: ciatlas/simulci-lab/.github/workflows/callee-r10.yml@main
  relative:
    uses: ./.github/workflows/callee-r10.yml
