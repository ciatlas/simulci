name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Dogfood: the route tests under .github/simulci/tests, run with the bundle that was just built.
      - run: node packages/cli/dist/index.js test
      # The published package holds exactly its bundle, README and licence, and no dependencies.
      - run: node ../../scripts/check-pack.mjs
        working-directory: packages/cli
      - run: pnpm coverage
      - id: upload
        if: always() && matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/

  fallow:
    # Code health (fallow.tools, policy in .fallowrc.jsonc): no unused files, exports or dependencies, no duplicated
    # code, the licence boundaries between packages/, apps/ and ee/ hold, and a pull request adds no complex,
    # duplicated or unused code compared with its base.
    name: Code health
    runs-on: ubuntu-latest
    env:
      FALLOW_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The audit compares the pull request with its base branch.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec fallow dead-code
      - run: pnpm exec fallow dupes
      - run: pnpm exec fallow architecture
      - id: audit
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec fallow audit --base "origin/$BASE_REF"

  workflows:
    # This repository's own workflows, checked by flowpact (built on the same @ciatlas/core).
    name: Workflows (flowpact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ciatlas/flowpact@d342e2e0fa2137bf332df2adde48e27639b820fe # v0.24.0
        with:
          mode: lint
          fail-on: warning

  zizmor:
    # Workflow security (zizmor.sh): template injection, credentials left in the checkout, cache poisoning, unpinned or
    # impostor actions and more. Findings fail the job and annotate the pull request.
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows
          version: 1.30.1
          advanced-security: false
          annotations: true

  schemas:
    # The JSON schemas under schemas/ are generated from the engine (pnpm schemas) and committed, so the $id URLs
    # GitHub Pages serves are always what the release defines. The routes lab's accuracy figure (pnpm lab:accuracy) is
    # committed the same way, so it is always what the engine predicts.
    name: Schemas and lab figure up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm schemas
      - run: git diff --exit-code -- schemas
      - run: pnpm lab:accuracy
      - run: git diff --exit-code -- fixtures/routes-lab/accuracy.json

  action-dist:
    # action.yml runs packages/action/dist/index.js straight from the repository, so the bundle is committed and must
    # be what the sources build.
    name: Action bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @simulci/action build
      - name: Compare with the committed bundle
        run: |
          if [ -n "$(git status --porcelain packages/action/dist)" ]; then
            git status --short packages/action/dist
            echo "::error::packages/action/dist is out of date. Run 'pnpm --filter @simulci/action build' and commit the result."
            exit 1
          fi

  action-dogfood:
    # The committed action on this repository: the route tests, then a plan.
    name: Action on this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tests
        name: Route tests
        uses: $/
        with:
          junit: simulci-junit.xml
      - id: plan
        name: The plan of a pull request
        uses: $/
        with:
          mode: plan
          scenario: '{ event: pull_request, base: main, head: feat/x, changed: [packages/engine/src/x.ts] }'
      - name: Check the outputs
        env:
          PASSED: ${{ steps.tests.outputs.passed }}
          FAILED: ${{ steps.tests.outputs.failed }}
          EXIT: ${{ steps.tests.outputs.exit-code }}
          TRIGGERED: ${{ steps.plan.outputs.triggered }}
        run: |
          set -x
          test "$PASSED" -ge 17
          test "$FAILED" -eq 0
          test "$EXIT" -eq 0
          test "$TRIGGERED" -eq 2
          test -s simulci-junit.xml

  browser-bundle:
    # The web app bundles the engine (and @ciatlas/core through its browser entry) for a Web Worker: the build must
    # succeed and nothing in it may import a Node built-in.
    name: Browser bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @simulci/web typecheck
      - run: pnpm --filter @simulci/web build
      - name: The bundle keeps its contract
        # The engine only in the worker chunk, core's browser entry, no Node built-in or packages/node, no inlined
        # font, gzip budgets.
        run: node scripts/check-web-bundle.mjs apps/web/dist

  web-e2e:
    # The web app in a real browser: the build as vite preview serves it, both workers included, driven by the specs
    # under apps/web/e2e in headless Chromium.
    name: Web app in Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Chromium build the pinned @playwright/test drives, and the system libraries it needs.
      - run: pnpm --filter @simulci/web exec playwright install --with-deps chromium
      - run: pnpm --filter @simulci/web build
      - run: pnpm --filter @simulci/web e2e
      - id: traces
        # A failed test keeps its trace (playwright.config.ts); `pnpm exec playwright show-trace` replays it.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results/

  docs:
    # The docs site (apps/docs): the static export builds, with its search index and an llms.txt whose links are
    # absolute.
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @simulci/docs build
      - name: The export has its search index and llms files, every link absolute
        working-directory: apps/docs/out
        run: |
          test -s index.html
          test -s api/search
          test -s llms.txt
          test -s llms-full.txt
          if grep -n '](/' llms.txt llms-full.txt; then
            echo "::error::llms.txt and llms-full.txt link by absolute URL only"
            exit 1
          fi

  ci-passed:
    # The only required status check: add new jobs to `needs` instead of changing the branch rules.
    name: CI passed
    if: always()
    needs: [test, fallow, workflows, zizmor, schemas, action-dist, action-dogfood, browser-bundle, web-e2e, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
