# Route tests for ci.yml: what runs for a push to main, a pull request, another branch, a skip-ci message.
workflow: ci.yml
given: { changed: [packages/engine/src/x.ts] }
cases:
  - name: a push to main runs every job; coverage is uploaded from node 24 only
    when: { event: push, branch: main }
    then:
      run: [test, fallow, workflows, zizmor, schemas, action-dist, action-dogfood, browser-bundle, web-e2e, docs, ci-passed]
      conclusion: success
      checks:
        - Test (node 22)
        - Test (node 24)
        - Code health
        - Workflows (flowpact)
        - Workflow security (zizmor)
        - Schemas and lab figure up to date
        - Action bundle is up to date
        - Action on this repository
        - Browser bundle
        - Web app in Chromium
        - Docs site
        - CI passed
      units:
        'test[node=22].upload': { runs: no, because: if }
        'test[node=24].upload': { runs: yes }
        fallow.audit: { runs: no, because: if } # the fallow audit compares against the base of a pull request
        web-e2e.traces: { runs: no, because: if } # the traces are uploaded only when a spec fails
  - name: a pull request also runs the fallow audit against its base
    when: { event: pull_request, base: main, head: feat/x }
    then:
      run: [test, fallow, workflows, zizmor, schemas, action-dist, action-dogfood, browser-bundle, web-e2e, docs, ci-passed]
      units:
        fallow.audit: { runs: yes }
  - name: a push to another branch starts nothing
    when: { event: push, branch: topic }
    then: { because: branches }
  - name: a skip-ci message starts nothing
    when: { event: push, branch: main, message: 'docs: typo [skip ci]' }
    then: { because: skip-ci }
